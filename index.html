<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Card</title>
        <link rel="stylesheet" href="style.css">
        <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

    </head>
    <body>
        <div class="card">
            <label class="switch">
                <input type="checkbox" id="themeToggle">
                <span class="slider"></span>
            </label>
            <img src="measpixel.png" alt="Avatar" class="avatar" id="avatar"/>
            <h1>NICOLE</h1>
            <p>Web Developer</p>
            <p>Mom/ Tech- Girl/ Bookgirl/ Homebody</p>
        <div class="socials">
            <div class="social">
                <img src="instagram.sgv" alt="Instagram"/>
                <a href="https://www.instagram.com/nicoleyxcv/" target="_blank">@nicoleyxcv</a>
            </div>
        <div class="social">
            <img src="tiktok.svg" alt="Tiktok"/>
            <a href="https://www.tiktok.com/@nf.reads" target="_blank">@nf.reads</a>
        </div>
        <div class="social">
            <img src="youtube.png" alt="Youtube"/>
            <a href="https://www.youtube.com/@nfreads" target="_blank">@nfreads</a>
        </div>
        </div>
        </div>

        <div class="overlay" id="overlay">
            <img src="measpixel.png" alt="Großer Avatar" class="avatar-large">
        </div>


        <script src="script.js"></script>
    </body>
</html>
